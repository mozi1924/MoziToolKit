name: Build & Release MoziToolKit

on:
  push:
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as Pre-Release (Yellow Tag)'
        type: boolean
        required: true
        default: true
      tag_name:
        description: 'Custom Tag Name (optional, defaults to Git tag or manifest version)'
        type: string
        required: false
        default: ''
      libmtk_ref:
        description: 'libmozitoolkit git ref used to build the native wheels'
        type: string
        required: true
        default: 'main'

env:
  # Temporary CI mirror (see .github/workflows/ci.yml). Falls back to blender.org.
  MTK_CI_ASSETS_BASE: https://github.com/mozi1924/mtk-ci-assets/releases/download/ci-assets-v1
  BLENDER_VERSION: "5.2.1"

permissions:
  contents: write

jobs:
  build-libmtk-wheels:
    name: Build libmtk_py wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout libmozitoolkit
        uses: actions/checkout@v4
        with:
          repository: mozi1924/libmozitoolkit
          ref: ${{ inputs.libmtk_ref || 'main' }}
          path: libmozitoolkit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install maturin
        shell: bash
        run: python -m pip install --upgrade pip maturin

      - name: Build abi3 wheel
        shell: bash
        working-directory: libmozitoolkit
        run: |
          mkdir -p "${{ github.workspace }}/wheel-out"
          maturin build --release \
            --target "${{ matrix.target }}" \
            --out "${{ github.workspace }}/wheel-out" \
            -m bindings/mtk-py/Cargo.toml

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: libmtk-wheel-${{ matrix.target }}
          path: wheel-out/*.whl
          if-no-files-found: error

  build-and-release:
    name: Build Multi-Platform Packages & Release
    needs: build-libmtk-wheels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MoziToolKit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all native wheels
        uses: actions/download-artifact@v4
        with:
          pattern: libmtk-wheel-*
          path: wheels
          merge-multiple: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            xz-utils \
            libgl1 \
            libegl1 \
            libxi6 \
            libxxf86vm1 \
            libxfixes3 \
            libxrender1 \
            libxkbcommon0 \
            libsm6 \
            libxext6 \
            unzip

      - name: Download & Install Blender
        run: |
          set -euo pipefail
          tar_name="blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz"
          if ! curl -fL --retry 3 -o "$tar_name" "$MTK_CI_ASSETS_BASE/$tar_name"; then
            echo "::warning::Blender mirror unavailable; falling back to download.blender.org"
            curl -fL --retry 3 -o "$tar_name" \
              "https://download.blender.org/release/Blender5.2/$tar_name"
          fi
          mkdir -p /opt/blender
          tar -xJf "$tar_name" -C /opt/blender --strip-components=1
          rm -f "$tar_name"
          echo "/opt/blender" >> $GITHUB_PATH
          /opt/blender/blender --version

      - name: Build & Package Extension
        run: |
          set -euo pipefail
          # build.py validates that every declared platform has its native wheel
          # and verifies the produced zips afterwards.
          python3 build.py --blender /opt/blender/blender

      - name: Prepare Linux test environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-test
          .venv-test/bin/pip install --upgrade pip pytest
          linux_wheel="$(ls wheels/libmtk_py-*manylinux*.whl | head -n 1)"
          if [ -z "$linux_wheel" ]; then
            echo "::error::No Linux libmtk_py wheel was downloaded"
            exit 1
          fi
          .venv-test/bin/pip install "$linux_wheel"
          echo "SITE_PACKAGES=$(.venv-test/bin/python -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"

      - name: Download real Minecraft assets
        run: bash .github/scripts/fetch_test_assets.sh

      - name: Run Test Suite
        run: |
          MTK_TEST_SITE_PACKAGES="$SITE_PACKAGES" \
            /opt/blender/blender -b --python tests/run_tests.py -- -q

      - name: Determine Release Tag & Status
        id: release_meta
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            MANIFEST_VER=$(python3 -c "import tomllib; print(tomllib.load(open('blender_manifest.toml', 'rb'))['version'])")
            TAG="v${MANIFEST_VER}-build.${{ github.run_number }}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            IS_PRERELEASE="true"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG (Pre-release: $IS_PRERELEASE)"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: MoziToolKit ${{ steps.release_meta.outputs.tag }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: dist/*.zip
          generate_release_notes: true
