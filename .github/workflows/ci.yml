name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      libmtk_ref:
        description: "Build libmozitoolkit from this git ref (empty = use the ci-latest wheel)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Temporary real-pack / Blender mirror. Downloads are non-fatal: if the mirror is
  # removed, the suite falls back to blender.org and skips asset-dependent tests.
  MTK_CI_ASSETS_BASE: https://github.com/mozi1924/mtk-ci-assets/releases/download/ci-assets-v1
  BLENDER_VERSION: "5.2.1"

jobs:
  pytest-mock:
    name: Pytest (mocked bpy, no Blender)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve libmtk_py wheel
        run: bash .github/scripts/fetch_libmtk_wheel.sh wheel "${{ github.event.inputs.libmtk_ref }}"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest wheel/*.whl

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download real Minecraft assets
        run: bash .github/scripts/fetch_test_assets.sh

      - name: Run test suite (mocked bpy)
        run: python -m pytest tests/ -q -rs

  blender:
    name: Blender headless suite (bpy integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve libmtk_py wheel
        run: bash .github/scripts/fetch_libmtk_wheel.sh wheel "${{ github.event.inputs.libmtk_ref }}"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest wheel/*.whl

      - name: Install system dependencies & unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libxkbcommon0 libsm6 libxext6 unzip

      - name: Download Blender
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/blender"
          tar_name="blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz"
          mkdir -p "$work"
          if ! curl -fL --retry 3 -o "$work/$tar_name" "$MTK_CI_ASSETS_BASE/$tar_name"; then
            echo "::warning::Blender mirror unavailable; falling back to download.blender.org"
            curl -fL --retry 3 -o "$work/$tar_name" \
              "https://download.blender.org/release/Blender5.2/$tar_name"
          fi
          mkdir -p "$work/opt"
          tar -xJf "$work/$tar_name" -C "$work/opt" --strip-components=1
          echo "$work/opt" >> "$GITHUB_PATH"
          "$work/opt/blender" --version

      - name: Download real Minecraft assets
        run: bash .github/scripts/fetch_test_assets.sh

      - name: Run Blender host suite
        run: |
          set -euo pipefail
          SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
          MTK_TEST_SITE_PACKAGES="$SITE_PACKAGES" \
            blender --background --python tests/run_tests.py -- -q -rs
