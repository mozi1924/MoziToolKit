name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      libmtk_ref:
        description: "Build or fetch libmozitoolkit from this git ref/tag (empty = use the ci-latest wheel)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Force UTF-8 for all Python processes (including test-spawned mock servers).
  # Windows pipes otherwise default to the legacy ANSI code page.
  PYTHONUTF8: "1"
  # Authenticate GitHub API calls (release resolution) and `gh` commands.
  # Unauthenticated calls are limited to 60/hour per IP, which shared runner
  # egress IPs exhaust easily.
  GH_TOKEN: ${{ github.token }}
  # Temporary real-pack / Blender mirror. Downloads are non-fatal: if the mirror is
  # removed, the suite falls back to blender.org and skips asset-dependent tests.
  MTK_CI_ASSETS_BASE: https://github.com/mozi1924/mtk-ci-assets/releases/download/ci-assets-v1
  BLENDER_VERSION: "5.2.1"

jobs:
  pytest-mock:
    name: Pytest (mocked bpy, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    env:
      # Sandbox config/cache so tests never touch the runner's user profile.
      MOZI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
      MTK_TEST_CACHE: ${{ github.workspace }}/.ci-cache
      MOZI_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@v4

      # Rust is only a fallback for building libmtk_py when the ci-latest wheel is
      # unavailable. Do not use Swatinem/rust-cache here: this repository has no
      # Cargo.toml, so its cargo metadata probe fails with exit code 101.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve libmtk_py wheel
        run: bash .github/scripts/fetch_libmtk_wheel.sh wheel "${{ github.event.inputs.libmtk_ref }}" ${{ matrix.platform }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest numpy
          python -m pip install --no-index --find-links wheel libmtk_py libmtk_blender_dna

      - name: Download real Minecraft assets
        run: python .github/scripts/fetch_test_assets.py

      - name: Precompile asset cache
        run: python .github/scripts/precompile_cache.py

      - name: Run test suite (mocked bpy)
        run: python -m pytest tests/ -q -rs

  blender:
    name: Blender headless suite (bpy integration)
    runs-on: ubuntu-latest
    env:
      MOZI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
      MTK_TEST_CACHE: ${{ github.workspace }}/.ci-cache
      MOZI_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@v4

      # Rust is only a fallback for building libmtk_py when the ci-latest wheel is
      # unavailable. Do not use Swatinem/rust-cache here: this repository has no
      # Cargo.toml, so its cargo metadata probe fails with exit code 101.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve libmtk_py wheel
        run: bash .github/scripts/fetch_libmtk_wheel.sh wheel "${{ github.event.inputs.libmtk_ref }}" linux-x64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links wheel libmtk_py libmtk_blender_dna

      - name: Install system dependencies & unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libxkbcommon0 libsm6 libxext6 unzip

      - name: Download Blender
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/blender"
          tar_name="blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz"
          mkdir -p "$work"
          if ! curl -fL --retry 3 -o "$work/$tar_name" "$MTK_CI_ASSETS_BASE/$tar_name"; then
            echo "::warning::Blender mirror unavailable; falling back to download.blender.org"
            curl -fL --retry 3 -o "$work/$tar_name" \
              "https://download.blender.org/release/Blender5.2/$tar_name"
          fi
          mkdir -p "$work/opt"
          tar -xJf "$work/$tar_name" -C "$work/opt" --strip-components=1
          echo "$work/opt" >> "$GITHUB_PATH"
          "$work/opt/blender" --version

      - name: Download real Minecraft assets
        run: python .github/scripts/fetch_test_assets.py

      - name: Precompile asset cache
        run: python .github/scripts/precompile_cache.py

      - name: Run Blender host suite
        run: |
          set -euo pipefail
          SITE_PACKAGES="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          MTK_TEST_SITE_PACKAGES="$SITE_PACKAGES" \
            blender --background --python tests/run_tests.py -- -q -rs

  blender-windows:
    name: Blender headless suite (Windows)
    runs-on: windows-latest
    env:
      MOZI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
      MTK_TEST_CACHE: ${{ github.workspace }}/.ci-cache
      MOZI_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve libmtk_py wheel
        run: bash .github/scripts/fetch_libmtk_wheel.sh wheel "${{ github.event.inputs.libmtk_ref }}" windows-x64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links wheel libmtk_py libmtk_blender_dna

      - name: Download & extract Blender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $work = Join-Path $env:RUNNER_TEMP "blender"
          $zip = Join-Path $work "blender.zip"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $name = "blender-${{ env.BLENDER_VERSION }}-windows-x64.zip"
          try {
            Invoke-WebRequest -Uri "$env:MTK_CI_ASSETS_BASE/$name" -OutFile $zip -UseBasicParsing -TimeoutSec 600
          } catch {
            Write-Warning "Blender mirror unavailable; falling back to download.blender.org"
            Invoke-WebRequest -Uri "https://download.blender.org/release/Blender5.2/$name" -OutFile $zip -UseBasicParsing -TimeoutSec 600
          }
          $opt = Join-Path $work "opt"
          Expand-Archive -Path $zip -DestinationPath $opt -Force
          $blender_dir = Join-Path $opt "blender-${{ env.BLENDER_VERSION }}-windows-x64"
          $exe = Join-Path $blender_dir "blender.exe"
          & $exe --version
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download real Minecraft assets
        run: python .github/scripts/fetch_test_assets.py

      - name: Precompile asset cache
        run: python .github/scripts/precompile_cache.py

      - name: Run Blender host suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $env:MTK_TEST_SITE_PACKAGES = $site
          blender --background --python tests/run_tests.py -- -q -rs

  rolling-build:
    name: Build & Publish Rolling Packages
    needs: [pytest-mock, blender, blender-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies & Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libxkbcommon0 libsm6 libxext6 unzip
          work="$RUNNER_TEMP/blender"
          tar_name="blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz"
          mkdir -p "$work"
          if ! curl -fL --retry 3 -o "$work/$tar_name" "$MTK_CI_ASSETS_BASE/$tar_name"; then
            echo "::warning::Blender mirror unavailable; falling back to download.blender.org"
            curl -fL --retry 3 -o "$work/$tar_name" \
              "https://download.blender.org/release/Blender5.2/$tar_name"
          fi
          mkdir -p "$work/opt"
          tar -xJf "$work/$tar_name" -C "$work/opt" --strip-components=1
          echo "$work/opt" >> "$GITHUB_PATH"
          "$work/opt/blender" --version

      - name: Fetch all 6 platform wheels from libmozitoolkit
        run: |
          python3 tools/fetch_wheels.py --release ci-latest --all --clean --out wheels/

      - name: Build & Package Extension (all platforms)
        run: |
          set -euo pipefail
          python3 build.py --blender "$RUNNER_TEMP/blender/opt/blender"

      - name: Upload Rolling Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mozitoolkit-rolling-packages
          path: dist/*.zip
          retention-days: 14

      - name: Publish to rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse --short HEAD)"
          gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create rolling --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "MoziToolKit Rolling Build (main)" \
              --notes "Continuous rolling build of MoziToolKit from main branch."
          gh release upload rolling dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "Successfully updated rolling release for commit $COMMIT_SHA"
